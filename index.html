<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d5b">
<link rel="apple-touch-icon" href="icon-192.png">
<title>விலை குறிப்பேடு · Price Tracker</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#222;--mu:#777;--ac:#2e7d5b;--ln:#e6e0d6;--gd:#e3f4ea;--gt:#1d6b47;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#222527;--tx:#eee;--mu:#9a9a9a;--ac:#4fb58a;--ln:#363a3c;--gd:#1d3a2c;--gt:#7fdcb0;--rd:#ef7a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191a;--card:#222527;--tx:#eee;--mu:#9a9a9a;--ac:#4fb58a;--ln:#363a3c;--gd:#1d3a2c;--gt:#7fdcb0;--rd:#ef7a6c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Tamil","Latha",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;margin-top:12px;font-weight:600;cursor:pointer}
.sm{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.item h3{margin:0;font-size:16px}
.meta{font-size:12px;color:var(--mu);margin:2px 0 8px}
.e{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.e.best{background:var(--gd);margin:0 -6px;padding:8px 6px;border-radius:8px}
.s{font-weight:600}.d{font-size:12px;color:var(--mu)}
.r{text-align:right}.p{font-weight:700}
.tag{display:inline-block;font-size:11px;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
.x{background:none;border:0;color:var(--rd);cursor:pointer;font-size:12px;padding:2px 0}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--card);border-radius:10px;cursor:pointer;font-size:13px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dh{display:flex;justify-content:space-between;font-weight:700;margin:14px 0 6px;font-size:14px}
.up{color:var(--rd)}.dn{color:var(--gt)}
</style>
</head>
<body>
<main>
<h1><span id="ttl"></span><span class="bar"><button class="sm" id="lg"></button></span></h1>
<div class="tabs" id="tabs"><button data-t="home" id="tb_home"></button><button data-t="cmp" id="tb_cmp"></button><button data-t="his" id="tb_his"></button></div>

<div id="v_home">
<div class="card">
  <label id="l_item"></label><input id="item" list="items" autocomplete="off">
  <label id="l_store"></label><input id="store" list="stores" autocomplete="off">
  <div class="row3">
    <div><label id="l_price"></label><input id="price" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label id="l_qty"></label><input id="qty" type="number" inputmode="decimal" min="0" step="any" value="1"></div>
    <div><label id="l_unit"></label><select id="unit"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pcs</option></select></div>
  </div>
  <div id="pv" style="margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--gd);color:var(--gt);font-weight:600;display:none"></div>
  <label id="l_date"></label><input id="date" type="date">
  <datalist id="items"></datalist><datalist id="stores"></datalist>
  <button class="btn" id="add"></button>
</div>

<input id="q" style="margin-bottom:12px">
<div id="list"></div>
</div>
<div id="v_cmp" style="display:none"><input id="cq" style="margin-bottom:12px"><div id="cmp"></div></div>
<div id="v_his" style="display:none"><input id="hq" style="margin-bottom:8px"><div class="row"><div><label id="l_hf"></label><input id="hf" type="date"></div><div><label id="l_ht"></label><input id="ht" type="date"></div></div><div id="his"></div></div>

<div class="card bar">
  <button class="sm" id="exp"></button>
  <button class="sm" id="imp"></button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<div class="d" id="note" style="text-align:center;padding-bottom:20px"></div>
</main>

<script>
var T={
 ttl:["விலை குறிப்பேடு","Price Tracker"],
 item:["பொருள்","Item"],store:["கடை","Store"],price:["மொத்த விலை (₹)","Total price (₹)"],
 qty:["அளவு","Qty"],unit:["அலகு","Unit"],date:["வாங்கிய தேதி","Date bought"],
 add:["சேமி","Save"],search:["பொருளைத் தேடு…","Search item…"],
 cheap:["மலிவு","Cheapest"],first:["முதலில் வாங்கியது","First bought"],
 empty:["இன்னும் பதிவுகள் இல்லை","No entries yet"],del:["நீக்கு","Delete"],
 exp:["காப்பு எடு (Backup)","Backup"],imp:["மீட்டெடு (Restore)","Restore"],
 note:["தரவு இந்த போனின் browser-ல் மட்டுமே சேமிக்கப்படும். அடிக்கடி Backup எடுங்கள்.","Data is saved only in this phone’s browser. Take a backup regularly."],
 need:["பொருள், கடை, விலை தேவை","Item, store and price are required"],
 ok:["Backup கோப்பு தயார்","Backup ready"],bad:["கோப்பு சரியில்லை","Invalid file"],
 tab_home:["பதிவு","Entries"],tab_cmp:["ஒப்பீடு","Compare"],tab_his:["வரலாறு","History"],
 from:["இருந்து","From"],to:["வரை","To"],hsearch:["பொருள் / கடை தேடு…","Search item / store…"],
 more:["ஒப்பிட மற்றொரு கடையின் விலை சேர்க்கவும்","Add another store’s price to compare"],prev:["முந்தையது","Previous"],total:["மொத்தம்","Total"]
};
var mode="both",data=[];
function $(i){return document.getElementById(i)}
function t(k){var a=T[k];return mode=="ta"?a[0]:mode=="en"?a[1]:a[0]+" / "+a[1]}
function load(){try{data=JSON.parse(localStorage.getItem("pt_data")||"[]")}catch(e){data=[]}
 try{mode=localStorage.getItem("pt_lang")||"both"}catch(e){}}
function save(){try{localStorage.setItem("pt_data",JSON.stringify(data))}catch(e){}}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
var F={kg:[1,"kg"],g:[0.001,"kg"],L:[1,"L"],ml:[0.001,"L"],pcs:[1,"pcs"]};
function up(e){var f=F[e.unit];return e.price/(e.qty*f[0])}
function ub(e){return F[e.unit][1]}
function fd(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function labels(){
 $("ttl").textContent=t("ttl");$("l_item").textContent=t("item");$("l_store").textContent=t("store");
 $("l_price").textContent=t("price");$("l_qty").textContent=t("qty");$("l_unit").textContent=t("unit");
 $("l_date").textContent=t("date");$("add").textContent=t("add");$("q").placeholder=t("search");
 $("exp").textContent=t("exp");$("imp").textContent=t("imp");$("note").textContent=t("note");
 $("lg").textContent=mode=="both"?"த + EN":mode=="ta"?"தமிழ்":"English";
 $("tb_home").textContent=t("tab_home");$("tb_cmp").textContent=t("tab_cmp");$("tb_his").textContent=t("tab_his");
 $("cq").placeholder=t("search");$("hq").placeholder=t("hsearch");$("l_hf").textContent=t("from");$("l_ht").textContent=t("to");
}
function render(){
 labels();pv();renderCmp();renderHis();
 var q=$("q").value.trim().toLowerCase(),g={};
 data.forEach(function(e){var k=e.item.toLowerCase();(g[k]=g[k]||[]).push(e)});
 $("items").innerHTML=Object.keys(g).map(function(k){return"<option value=\""+esc(g[k][0].item)+"\">"}).join("");
 var st={};data.forEach(function(e){st[e.store]=1});
 $("stores").innerHTML=Object.keys(st).map(function(s){return"<option value=\""+esc(s)+"\">"}).join("");
 var keys=Object.keys(g).filter(function(k){return!q||k.indexOf(q)>-1}).sort();
 if(!keys.length){$("list").innerHTML="<div class=empty>"+t("empty")+"</div>";return}
 $("list").innerHTML=keys.map(function(k){
  var a=g[k].slice().sort(function(x,y){return y.date<x.date?-1:y.date>x.date?1:0});
  var first=a.reduce(function(m,e){return e.date<m?e.date:m},a[0].date);
  var best=Math.min.apply(null,a.map(up));
  var multi=a.length>1;
  return"<div class='card item'><h3>"+esc(a[0].item)+"</h3><div class=meta>"+t("first")+": "+fd(first)+"</div>"+
  a.map(function(e){
   var isb=multi&&Math.abs(up(e)-best)<1e-9;
   return"<div class='e"+(isb?" best":"")+"'><div><div class=s>"+esc(e.store)+(isb?"<span class=tag>"+(mode=="en"?"Cheapest":mode=="ta"?"மலிவு":"மலிவு")+"</span>":"")+"</div><div class=d>"+fd(e.date)+" · "+e.qty+" "+e.unit+"</div></div>"+
   "<div class=r><div class=p>₹"+(+e.price).toFixed(2)+"</div><div class=d>₹"+up(e).toFixed(2)+"/"+ub(e)+"</div><button class=x data-id='"+e.id+"'>"+(mode=="en"?"Delete":"நீக்கு")+"</button></div></div>";
  }).join("")+"</div>";
 }).join("");
}
function pv(){
 var p=parseFloat($("price").value),q=parseFloat($("qty").value),u=$("unit").value,b=$("pv");
 if(!(p>=0)||isNaN(p)||!(q>0)){b.style.display="none";return}
 var v=p/(q*F[u][0]),base=F[u][1],
  l=u=="pcs"?["ஒன்றின் விலை","Per piece"]:["1 "+base+" விலை","Per 1 "+base];
 b.textContent=(mode=="ta"?l[0]:mode=="en"?l[1]:l[0]+" / "+l[1])+": ₹"+v.toFixed(2);
 b.style.display="";
}
var tab="home";
function showTab(n){tab=n;["home","cmp","his"].forEach(function(i){$("v_"+i).style.display=i==n?"":"none";$("tb_"+i).className=i==n?"on":""})}
$("tabs").onclick=function(ev){var n=ev.target.getAttribute&&ev.target.getAttribute("data-t");if(n)showTab(n)};
function renderCmp(){
 var q=$("cq").value.trim().toLowerCase(),g={};
 data.forEach(function(e){var k=e.item.toLowerCase();(g[k]=g[k]||[]).push(e)});
 var keys=Object.keys(g).sort().filter(function(k){return!q||k.indexOf(q)>-1});
 if(!keys.length){$("cmp").innerHTML="<div class=empty>"+t("empty")+"</div>";return}
 $("cmp").innerHTML=keys.map(function(k){
  var m={};g[k].forEach(function(e){var s=e.store.toLowerCase();if(!m[s]||e.date>=m[s].date)m[s]=e});
  var a=Object.keys(m).map(function(s){return m[s]}).sort(function(x,y){return up(x)-up(y)});
  var b=up(a[0]);
  return"<div class='card item'><h3>"+esc(a[0].item)+"</h3>"+(a.length<2?"<div class=meta>"+t("more")+"</div>":"<div class=meta></div>")+
  a.map(function(e,i){
   var h=g[k].filter(function(x){return x.store.toLowerCase()==e.store.toLowerCase()}).sort(function(x,y){return x.date<y.date?-1:1});
   var tr="";
   if(h.length>1){var p=up(h[h.length-2]),c=up(e),d=c-p;
    tr="<div class='d "+(d>0?"up":d<0?"dn":"")+"'>"+t("prev")+" ₹"+p.toFixed(2)+" → ₹"+c.toFixed(2)+(d>0?" ▲":d<0?" ▼":"")+"</div>"}
   var df=i==0?(a.length>1?"<span class=tag>"+(mode=="en"?"Cheapest":"மலிவு")+"</span>":""):"<div class='d up'>+₹"+(up(e)-b).toFixed(2)+" (+"+((up(e)-b)/b*100).toFixed(0)+"%)</div>";
   return"<div class='e"+(i==0&&a.length>1?" best":"")+"'><div><div class=s>"+esc(e.store)+(i==0?df:"")+"</div><div class=d>"+fd(e.date)+" · ₹"+(+e.price).toFixed(2)+" / "+e.qty+" "+e.unit+"</div>"+tr+"</div><div class=r><div class=p>₹"+up(e).toFixed(2)+"/"+ub(e)+"</div>"+(i>0?df:"")+"</div></div>";
  }).join("")+"</div>";
 }).join("");
}
function renderHis(){
 var q=$("hq").value.trim().toLowerCase(),f=$("hf").value,to=$("ht").value;
 var a=data.filter(function(e){return(!q||e.item.toLowerCase().indexOf(q)>-1||e.store.toLowerCase().indexOf(q)>-1)&&(!f||e.date>=f)&&(!to||e.date<=to)}).sort(function(x,y){return y.date<x.date?-1:y.date>x.date?1:0});
 if(!a.length){$("his").innerHTML="<div class=empty>"+t("empty")+"</div>";return}
 var days={},order=[];
 a.forEach(function(e){if(!days[e.date]){days[e.date]=[];order.push(e.date)}days[e.date].push(e)});
 var all=0;
 $("his").innerHTML=order.map(function(d){
  var s=days[d].reduce(function(m,e){return m+ +e.price},0);all+=s;
  return"<div class=dh><span>"+fd(d)+"</span><span>₹"+s.toFixed(2)+"</span></div><div class=card style='padding:4px 12px'>"+
  days[d].map(function(e,i){return"<div class=e"+(i==0?" style='border-top:0'":"")+"><div><div class=s>"+esc(e.item)+"</div><div class=d>"+esc(e.store)+" · "+e.qty+" "+e.unit+"</div></div><div class=p>₹"+(+e.price).toFixed(2)+"</div></div>"}).join("")+"</div>";
 }).join("")+"<div class=dh style='border-top:2px solid var(--ln);padding-top:10px'><span>"+t("total")+"</span><span>₹"+all.toFixed(2)+"</span></div>";
}
$("add").onclick=function(){
 var item=$("item").value.trim(),store=$("store").value.trim(),price=parseFloat($("price").value),qty=parseFloat($("qty").value)||1;
 if(!item||!store||!(price>=0)||isNaN(price)){alert(t("need"));return}
 data.push({id:Date.now()+""+Math.floor(Math.random()*1000),item:item,store:store,price:price,qty:qty,unit:$("unit").value,date:$("date").value||today()});
 save();$("price").value="";$("qty").value=1;$("store").focus();render();
};
$("list").onclick=function(ev){var id=ev.target.getAttribute&&ev.target.getAttribute("data-id");
 if(id){data=data.filter(function(e){return e.id!==id});save();render()}};
$("q").oninput=render;
["price","qty","unit"].forEach(function(i){$(i).oninput=pv;$(i).onchange=pv});
["cq","hq","hf","ht"].forEach(function(i){$(i).oninput=render;$(i).onchange=render});
$("lg").onclick=function(){mode=mode=="both"?"ta":mode=="ta"?"en":"both";try{localStorage.setItem("pt_lang",mode)}catch(e){}render()};
$("exp").onclick=function(){
 var b=new Blob([JSON.stringify(data)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="price-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;data=d;save();render()}catch(e){alert(t("bad"))}};r.readAsText(f)};
load();$("date").value=today();showTab("home");render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js")}catch(e){}})}
</script>
</body>
</html>
